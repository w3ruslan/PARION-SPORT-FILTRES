<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parion Sport - Veri Düzenleyici</title>
<style>
    :root{--bg:#eef1f6;--panel:#fff;--panel2:#f7f9fc;--border:#dde2ea;--text:#1f2a37;--muted:#6b7585;--primary:#2563eb;--primary2:#1d4ed8;--gold:#b7791f;--green:#16a34a;}
    *{box-sizing:border-box;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding:22px;margin:0;line-height:1.4;}
    .wrap{max-width:1250px;margin:auto;border:1px solid var(--border);padding:24px;background:var(--panel);box-shadow:0 10px 30px rgba(31,42,55,.08);border-radius:14px;}
    h2.title{text-align:center;font-weight:700;border-bottom:2px solid var(--primary);padding-bottom:12px;margin:0 0 16px;font-size:1.4em;}
    h4{margin:0 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;}
    textarea{width:100%;height:200px;background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:12px;font-size:12px;border-radius:8px;resize:vertical;font-family:'SF Mono','Consolas','Courier New',monospace;}
    textarea:focus,input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
    button{background:var(--primary);color:#fff;border:none;padding:13px;cursor:pointer;font-weight:600;width:100%;font-size:1em;margin-top:10px;text-transform:uppercase;letter-spacing:.3px;border-radius:8px;box-shadow:0 2px 6px rgba(37,99,235,.25);}
    button:hover{background:var(--primary2);}
    button.copy{background:#7c3aed;}
    #stats{background:var(--panel2);padding:12px;border-radius:10px;text-align:center;font-weight:600;border:1px solid var(--border);margin:14px 0;}
    .league{margin-top:18px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
    .league-head{background:var(--primary);color:#fff;padding:8px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;}
    table{width:100%;border-collapse:collapse;font-size:12px;}
    th{background:var(--panel2);color:var(--muted);text-transform:uppercase;font-size:10px;padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);}
    td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:center;}
    td.time{color:var(--gold);font-weight:700;width:52px;}
    td.match{text-align:left;font-weight:600;min-width:190px;}
    td.score{font-family:'SF Mono','Consolas',monospace;font-weight:700;color:var(--gold);width:44px;}
    .odds{font-family:'SF Mono','Consolas',monospace;white-space:nowrap;}
    .fav{color:var(--green);font-weight:800;}
    .htsc{color:var(--muted);font-size:10px;}
    .none{color:#cbd5e1;}
    tr:hover td{background:#fafcff;}
</style>
</head>
<body>
<div class="wrap">
    <h2 class="title">📋 PARION SPORT — VERİ DÜZENLEYİCİ</h2>
    <h4>Bülteni buraya yapıştır (sayfadan kopyaladığın ham hali):</h4>
    <textarea id="raw" placeholder="Samedi 01 Novembre ... L1 McDonald's (3) ... yapıştır"></textarea>
    <button onclick="düzenle()">📊 DÜZENLE VE LİSTELE</button>
    <button class="copy" onclick="kopyala()">📋 DÜZENLİ VERİYİ KOPYALA</button>
    <div id="stats"></div>
    <div id="out"></div>
</div>

<script>
let exportText = "";

function parseData(line){
    let fields = line.split('\t').map(s=>s.trim());
    let score = /^\d+-\d+$/.test(fields[0]) ? fields[0] : null;
    let odds = (line.match(/\d+,\d+/g)||[]).map(x=>parseFloat(x.replace(',','.')));
    let htM = line.match(/\[(\d+:\d+)\]/);
    let htScore = htM ? htM[1] : null;
    let ft=null, ht=null, mt=null;
    if(odds.length>=3) ft = odds.slice(0,3);
    if(htScore){
        if(odds.length>=6) ht = odds.slice(3,6);
        if(odds.length>=9) mt = odds.slice(6,9);
    } else {
        if(odds.length>=6) mt = odds.slice(3,6);
    }
    return {score, htScore, ft, ht, mt};
}

function favIdx(o){ if(!o) return -1; let m=Math.min(o[0],o[1],o[2]); return o.indexOf(m); }
function oddsHtml(o){
    if(!o) return '<span class="none">-</span>';
    let f=favIdx(o), lbl=['1','N','2'];
    return o.map((v,i)=>`<span class="${i===f?'fav':''}">${lbl[i]} ${v.toFixed(2)}</span>`).join(' ');
}

function düzenle(){
    let lines = document.getElementById('raw').value.split(/\r?\n/);
    let leagues = [];   // {name, count, matches:[]}
    let cur = null, pendingTime = '', pendingTeam = '';
    lines.forEach(raw=>{
        let line = raw.replace(/\s+$/,'');   // sağ boşlukları at
        let t = line.trim();
        if(!t) return;
        let lm = t.match(/^(.+?)\s*\((\d+)\)$/);          // Lig (sayı)
        let tm = t.match(/^(\d{1,2})h(\d{2})$/);          // saat
        let hasOdds = /\d+,\d+/.test(t);                  // veri satırı (oran var)
        if(lm && !hasOdds){
            cur = {name:lm[1].trim(), count:lm[2], matches:[]};
            leagues.push(cur);
        } else if(tm){
            pendingTime = t;
        } else if(hasOdds){
            if(!cur){ cur={name:'DİĞER',count:'',matches:[]}; leagues.push(cur); }
            let d = parseData(line);
            cur.matches.push({time:pendingTime, team:pendingTeam, ...d});
        } else {
            pendingTeam = t;   // takım satırı (ya da başlık, zararsız)
        }
    });

    let totalM = leagues.reduce((a,l)=>a+l.matches.length,0);
    document.getElementById('stats').innerText = `${leagues.length} lig  •  ${totalM} maç düzenlendi`;

    let html='', exp=['LIG | SAAT | MAC | SKOR | MS(1/N/2) | IY[skor](1/N/2) | MT(1/N/2)'];
    leagues.forEach(l=>{
        if(!l.matches.length) return;
        html += `<div class="league"><div class="league-head"><span>${l.name}</span><span>${l.matches.length} maç</span></div>
        <table><thead><tr><th>Saat</th><th>Maç</th><th>Skor</th><th>Maç Sonucu</th><th>İlk Yarı</th><th>MT</th></tr></thead><tbody>`;
        l.matches.forEach(m=>{
            html += `<tr>
                <td class="time">${m.time||'-'}</td>
                <td class="match">${m.team||'-'}</td>
                <td class="score">${m.score||'?'}</td>
                <td class="odds">${oddsHtml(m.ft)}</td>
                <td class="odds">${m.htScore?`<span class="htsc">[${m.htScore}]</span> `:''}${oddsHtml(m.ht)}</td>
                <td class="odds">${oddsHtml(m.mt)}</td>
            </tr>`;
            let f=o=>o?o.map(v=>v.toFixed(2)).join('/'):'-';
            exp.push(`${l.name} | ${m.time||''} | ${m.team||''} | ${m.score||'?'} | ${f(m.ft)} | ${m.htScore?'['+m.htScore+'] ':''}${f(m.ht)} | ${f(m.mt)}`);
        });
        html += `</tbody></table></div>`;
    });
    document.getElementById('out').innerHTML = html || '<div style="color:var(--muted);padding:14px;">Veri bulunamadı — ham bülteni yapıştır.</div>';
    exportText = exp.join('\n');
}

function kopyala(){
    if(!exportText){ alert('Önce DÜZENLE bas.'); return; }
    const done=()=>alert('✅ Kopyalandı!');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(exportText).then(done).catch(fb); else fb();
    function fb(){let ta=document.createElement('textarea');ta.value=exportText;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('Kopyalanamadı');}document.body.removeChild(ta);}
}
</script>
</body>
</html>
