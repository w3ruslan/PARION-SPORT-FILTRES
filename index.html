<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bülten Filtre</title>
<style>
    :root{--bg:#eef1f6;--panel:#fff;--panel2:#f7f9fc;--border:#dde2ea;--text:#1f2a37;--muted:#6b7585;--primary:#2563eb;--primary2:#1d4ed8;--gold:#b7791f;--green:#16a34a;--hl:#fff6c8;--hlb:#e0a106;}
    *{box-sizing:border-box;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding:22px;margin:0;line-height:1.4;}
    .wrap{max-width:1050px;margin:auto;border:1px solid var(--border);padding:24px;background:var(--panel);box-shadow:0 10px 30px rgba(31,42,55,.08);border-radius:14px;}
    h2.title{text-align:center;font-weight:700;border-bottom:2px solid var(--primary);padding-bottom:12px;margin:0 0 16px;font-size:1.4em;}
    h4{margin:0 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;}
    textarea{width:100%;height:150px;background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:12px;font-size:12px;border-radius:8px;resize:vertical;font-family:'SF Mono','Consolas','Courier New',monospace;}
    textarea:focus,input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
    button{background:var(--primary);color:#fff;border:none;padding:12px;cursor:pointer;font-weight:600;width:100%;font-size:1em;margin-top:10px;text-transform:uppercase;letter-spacing:.3px;border-radius:8px;box-shadow:0 2px 6px rgba(37,99,235,.25);}
    button:hover{background:var(--primary2);}
    button.secondary{background:var(--gold);}
    button.copy{background:#7c3aed;}
    input,select{background:#fff;color:var(--text);border:1px solid var(--border);padding:7px 8px;border-radius:6px;font-family:inherit;font-size:12px;}
    .fbox{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:12px;}
    .frow{display:flex;flex-wrap:wrap;gap:14px;align-items:end;}
    .fg{display:flex;flex-direction:column;gap:4px;}
    .fg label{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:600;}
    .fg .mm{display:flex;gap:4px;}
    .fg .mm input{width:60px;}
    #stats{background:var(--panel2);padding:12px;border-radius:10px;text-align:center;font-weight:600;border:1px solid var(--border);margin:14px 0;}
    .round{margin-top:16px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
    .round-head{background:var(--primary);color:#fff;padding:8px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{background:var(--panel2);color:var(--muted);text-transform:uppercase;font-size:10px;padding:7px 8px;text-align:center;border-bottom:1px solid var(--border);}
    td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:center;}
    td.match{text-align:left;font-weight:600;min-width:240px;}
    .pts{font-size:10px;color:var(--muted);font-weight:400;margin-top:2px;}
    .pts b{color:var(--primary);}
    .dsb{display:inline-block;margin-top:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:#eef2ff;color:#475569;border:1px solid #dbe3f5;}
    .dsb.hot{background:#dcfce7;color:#15803d;border-color:#86efac;}
    .dsb.dq{background:#fef2f2;color:#b91c1c;border-color:#fecaca;}
    .dsb .rc{margin-left:5px;font-weight:800;}
    .dsdetail{display:block;font-size:9px;color:var(--muted);margin-top:2px;font-weight:400;}
    .rtag{display:inline-block;font-size:9px;font-weight:600;color:var(--muted);background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:0 4px;vertical-align:middle;}
    .fixinput{background:#eef4ff;border:2px solid var(--primary);border-radius:10px;padding:12px;margin-top:14px;}
    .fixinput h4{color:var(--primary2);}
    .fixwrap{border:2px solid var(--primary);border-radius:12px;padding:12px;margin:14px 0;background:#f5f8ff;}
    .fixtitle{font-weight:700;color:var(--primary2);margin-bottom:8px;font-size:14px;text-align:center;}
    td.score{font-family:'SF Mono','Consolas',monospace;font-weight:700;color:var(--gold);width:48px;}
    td.date{color:var(--muted);font-size:11px;width:60px;}
    td.od{font-family:'SF Mono','Consolas',monospace;width:66px;}
    td.od.hl{background:var(--hl);font-weight:800;border-radius:4px;box-shadow:inset 0 0 0 1px var(--hlb);}
    tr:hover td{background:#fafcff;}
    tr:hover td.od.hl{background:#fdeeb0;}
    tr.row-hl td{background:#e8f6ee !important;}
    tr.row-hl td.match{box-shadow:inset 4px 0 0 var(--green);}
    tr.row-hl td.od.hl{background:#d7f0df !important;}
    tr.row-win td{background:#c9f4d6 !important;}
    tr.row-win td.match{box-shadow:inset 4px 0 0 #16a34a;}
    tr.row-loss td{background:#fbe0e0 !important;}
    tr.row-loss td.match{box-shadow:inset 4px 0 0 #dc2626;}
</style>
</head>
<body>
<div class="wrap">
    <h2 class="title">⚽ BÜLTEN FİLTRE</h2>
    <h4>Bülteni buraya yapıştır (en yüksek round üstte, 1. Round en altta):</h4>
    <textarea id="raw" placeholder="La Liga, Serie A, Premier Lig... hepsini alt alta yapıştır. Örn: 38. Round ... Villarreal - Atl. Madrid  5:1  2.54  3.84  2.55  24.05. ..."></textarea>
    <button onclick="düzenle()">📊 DÜZENLE</button>

    <div class="fixinput">
        <h4>📋 FİKSTÜR (gelecek maçlar) — ayrı yapıştır:</h4>
        <textarea id="fixture" placeholder="1. Round&#10;21.08. 21:45  Marseille - Strasbourg  5  1.63  4.29  4.49&#10;22.08. 18:15  Lens - Auxerre  6  1.59  4.18  5.05 ..."></textarea>
    </div>

    <div class="fbox">
        <div class="frow">
            <div class="fg"><label>Round (hafta)</label><select id="f_round" onchange="render()"><option value="ALL">HEPSİ</option></select></div>
            <div class="fg"><label>Sonuç</label><select id="f_res" onchange="render()"><option value="ALL">HEPSİ</option><option value="1">1 (ev) bitenler</option><option value="X">Berabere</option><option value="2">2 (dep) bitenler</option><option value="PEND">Oynanmamış</option></select></div>
            <div class="fg"><label>Beraberlik (MS X)</label><select id="f_draw" onchange="render()"><option value="ALL">HEPSİ</option><option value="warn">⚠️ Beraberlik uyarısı</option></select></div>
            <div class="fg"><label>Kaç maç sonra başlasın</label><input id="s_after" value="2" onchange="render()" oninput="render()" style="width:70px"></div>
            <div class="fg"><label>Kaç maç sürsün</label><input id="s_count" value="4" onchange="render()" oninput="render()" style="width:70px"></div>
            <div class="fg"><label>Kazananlar</label><label style="display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 0;cursor:pointer"><input type="checkbox" id="f_winners" onchange="render()" style="width:auto"> ✅ berabere bitenleri yeşil yap</label></div>
            <div class="fg"><label>Oran 1 (min/max)</label><div class="mm"><input id="o1min"><input id="o1max"></div></div>
            <div class="fg"><label>Oran X (min/max)</label><div class="mm"><input id="oXmin"><input id="oXmax"></div></div>
            <div class="fg"><label>Oran 2 (min/max)</label><div class="mm"><input id="o2min"><input id="o2max"></div></div>
            <div class="fg"><label>Görünüm</label><label style="display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 0;cursor:pointer"><input type="checkbox" id="f_only" onchange="render()" style="width:auto"> 🔒 sadece seçilenleri göster</label></div>
        </div>
        <button class="secondary" onclick="render()">FİLTRELE</button>
    </div>

    <button class="copy" onclick="kopyala()">📋 SONUCU KOPYALA</button>
    <div id="stats"></div>
    <div id="fixout"></div>
    <div id="out"></div>
</div>

<script>
let rounds = [], exportText = "", teamHist = {}, streakInfo = new Map(), fixtureMatches = [];
const roundRe = /^(\d+)\.\s*Round/i;
const mRe = /^(.+?)\s+-\s+(.+?)\s+(?:(\d+):(\d+)\s+)?(\d+\.\d+)\s+(\d+\.\d+)\s+(\d+\.\d+)(?:\s+([\d.]+))?\s*$/;

function düzenle(){
    let lines = document.getElementById('raw').value.split(/\r?\n/);
    rounds = []; let cur = null;
    lines.forEach(raw=>{
        let l = raw.replace(/\s+$/,''), t = l.trim(); if(!t) return;
        let rm = t.match(roundRe);
        if(rm){ cur = {no:rm[1], matches:[]}; rounds.push(cur); return; }
        let m = l.match(mRe);
        if(m){
            let sc = (m[3]!=null) ? m[3]+':'+m[4] : null;
            let res = sc ? (+m[3]>+m[4]?'1':(+m[3]<+m[4]?'2':'X')) : null;
            let match = { home:m[1].trim(), away:m[2].trim(), score:sc, res:res,
                          hg:(m[3]!=null?+m[3]:null), ag:(m[4]!=null?+m[4]:null),
                          o:[parseFloat(m[5]),parseFloat(m[6]),parseFloat(m[7])], date:m[8]||'' };
            if(!cur){ cur={no:'?',matches:[]}; rounds.push(cur); }
            cur.matches.push(match);
        }
    });
    // Takım geçmişi (puan + attığı/yediği gol) — liste yeni→eski sırada
    teamHist = {};
    rounds.forEach(r=>r.matches.forEach(m=>{
        if(m.res==null || m.hg==null) return;
        let hp = m.res==='1'?3:(m.res==='X'?1:0), ap = m.res==='2'?3:(m.res==='X'?1:0);
        (teamHist[m.home]=teamHist[m.home]||[]).push({p:hp, gf:m.hg, ga:m.ag});
        (teamHist[m.away]=teamHist[m.away]||[]).push({p:ap, gf:m.ag, ga:m.hg});
    }));
    streakInfo = computeStreaks();
    fixtureMatches = parseFixture();

    let sel = document.getElementById('f_round'); sel.innerHTML = '<option value="ALL">HEPSİ</option>';
    rounds.forEach(r=>{ let o=document.createElement('option'); o.value=r.no; o.textContent='Round '+r.no+' ('+r.matches.length+')'; sel.appendChild(o); });
    render();
}

function num(id,d){ let v=parseFloat((document.getElementById(id).value||'').replace(',','.')); return isNaN(v)?d:v; }
function pts(team){ let a=teamHist[team]||[]; let sp=x=>x.reduce((p,c)=>p+c.p,0); return {t:sp(a), s5:sp(a.slice(0,5)), s10:sp(a.slice(0,10)), n:a.length}; }
function last5(team){ let a=(teamHist[team]||[]).slice(0,5); return { pts:a.reduce((s,x)=>s+x.p,0), gf:a.reduce((s,x)=>s+x.gf,0), ga:a.reduce((s,x)=>s+x.ga,0), n:a.length }; }

// === BERABERLİK SERİSİ UYARISI ===
// Bir takım üst üste 2 maç berabere kalmayınca, 3. maçtan 6. maça kadar "beraberlik gecikti" uyarısı.
// Araya bir beraberlik girerse seri sıfırlanır.
let SMIN = 2, SMAX = 5;   // seri penceresi — arayüzden ayarlanır (render içinde güncellenir)
function inWin(s){ return s>=SMIN && s<=SMAX; }
// Her maç için, o maça GİRERKEN takımların üst üste kaç maçtır berabere kalmadığını (kronolojik) hesapla.
function computeStreaks(){
    let chrono = [];                              // eski → yeni (round listesi yeni→eski geldiği için ters)
    for(let i=rounds.length-1; i>=0; i--) chrono.push(...rounds[i].matches);
    let streak = {}, info = new Map();
    chrono.forEach(m=>{
        let sh = streak[m.home]||0, sa = streak[m.away]||0;
        info.set(m, {sh, sa});                    // maça girerken (bu maç dahil değil) seri
        if(m.res!=null){                          // oynanmışsa seriyi güncelle
            streak[m.home] = (m.res==='X') ? 0 : sh+1;
            streak[m.away] = (m.res==='X') ? 0 : sa+1;
        }
    });
    return info;
}
function drawWarn(m){
    let inf = streakInfo.get(m);
    if(!inf) return {ok:false, warn:false, detail:'veri yok'};
    let warn = inWin(inf.sh) || inWin(inf.sa);
    let tag = s => inWin(s) ? `<b>${s}</b>✓` : s;
    return {ok:true, warn, sh:inf.sh, sa:inf.sa,
        detail:`${m.home}: ${tag(inf.sh)} maçtır berabere yok · ${m.away}: ${tag(inf.sa)} maçtır berabere yok`};
}
// Geçmiş (oynanmış) maçlarda: uyarı çıkan maçların gerçekte kaçı X bitmiş?
function drawBacktest(){
    let played=0, X=0, pass=0, passX=0;
    rounds.forEach(r=>r.matches.forEach(m=>{
        if(!m.res) return; played++; if(m.res==='X') X++;
        let d=drawWarn(m);
        if(d.ok && d.warn){ pass++; if(m.res==='X') passX++; }
    }));
    return {played, X, base:played?X/played:0, pass, passX, rate:pass?passX/pass:0};
}

// Tarih anahtarı: "DD.MM." → sıralanabilir sayı (sezon: Ağu→May, yani 7-12. aylar önce)
function dateKey(d){ let m=(d||'').match(/(\d{1,2})\.(\d{1,2})/); if(!m) return 1e9; let day=+m[1], mon=+m[2]; return (mon>=7?mon:mon+12)*100+day; }

// === FİKSTÜR (gelecek maçlar) — format: "TARİH SAAT \t Ev - Dep \t \t B's \t 1 \t X \t 2" (skor yok) ===
function parseFixture(){
    let lines = document.getElementById('fixture').value.split(/\r?\n/);
    let out=[], curRound='?', lastDate='';
    lines.forEach(raw=>{
        let line=raw.replace(/\s+$/,''), t=line.trim(); if(!t) return;
        let rm=t.match(/^(\d+)\.\s*Round/i);
        if(rm){ curRound=rm[1]; lastDate=''; return; }
        let parts=line.split('\t').map(s=>s.trim());
        let mi=parts.findIndex(p=>/ - /.test(p)); if(mi<0) return;
        let mm=parts[mi].split(/\s+-\s+/); if(mm.length<2) return;
        let dt=parts.slice(0,mi).filter(Boolean).join(' ');
        let dm=dt.match(/(\d{1,2}\.\d{1,2}\.?)/);
        let date=dm?dm[1]:lastDate; if(dm) lastDate=date;
        let odds=parts.slice(mi+1).filter(p=>/^\d+\.\d+$/.test(p)).map(parseFloat);
        out.push({round:curRound, date, home:mm[0].trim(), away:mm[1].trim(), o:odds.length>=3?odds.slice(0,3):null});
    });
    return out;
}
// Bir takımın ŞU ANKİ üst üste berabere-kalmama serisi (teamHist yeni→eski)
function teamCurrentStreak(team){ let a=teamHist[team]||[], s=0; for(let x of a){ if(x.gf===x.ga) break; s++; } return s; }
function renderFixture(){
    let box=document.getElementById('fixout');
    if(!fixtureMatches.length){ box.innerHTML=''; return; }
    let byR={}, order=[];
    fixtureMatches.forEach(m=>{ if(!byR[m.round]){byR[m.round]=[];order.push(m.round);} byR[m.round].push(m); });
    order.sort((a,b)=>(parseInt(b)||-1)-(parseInt(a)||-1));
    let html='';
    order.forEach(rno=>{
        let rows='';
        byR[rno].forEach(m=>{
            let sh=teamCurrentStreak(m.home), sa=teamCurrentStreak(m.away);
            let warn=inWin(sh)||inWin(sa);
            let tag=s=>inWin(s)?`<b>${s}</b>✓`:s;
            let od=m.o?m.o.map((v,i)=>`<td class="od${i===1&&warn?' hl':''}">${v.toFixed(2)}</td>`).join(''):'<td class="od">—</td><td class="od">—</td><td class="od">—</td>';
            let badge=warn?`<span class="dsb hot">⚠️ Beraberlik Uyarısı</span>`:`<span class="dsb">Uyarı yok</span>`;
            let detail=`<span class="dsdetail">${m.home}: ${tag(sh)} maçtır berabere yok · ${m.away}: ${tag(sa)} maçtır berabere yok</span>`;
            rows+=`<tr${warn?' class="row-hl"':''}><td class="date">${m.date}</td><td class="match">${m.home} - ${m.away}${badge}${detail}</td>${od}</tr>`;
        });
        html+=`<div class="round"><div class="round-head"><span>${rno}. Round</span></div><table><thead><tr><th>Tarih</th><th>Maç</th><th>1</th><th>X</th><th>2</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    });
    box.innerHTML=`<div class="fixwrap"><div class="fixtitle">📋 FİKSTÜR — Gelecek Maçlar (geçmiş forma göre beraberlik analizi)</div>${html}</div>`;
}

function render(){
    if(!rounds.length){ document.getElementById('out').innerHTML=''; document.getElementById('stats').innerText='Önce bülteni yapıştır + DÜZENLE.'; return; }
    let fr=document.getElementById('f_round').value, fres=document.getElementById('f_res').value, fdraw=document.getElementById('f_draw').value;
    // seri penceresi ayarları: N maçtan sonra başla, M maç sürsün → seri N..(N+M-1) arası uyarır
    let sAfter=Math.max(1,Math.round(num('s_after',2))), sCount=Math.max(1,Math.round(num('s_count',4)));
    SMIN=sAfter; SMAX=sAfter+sCount-1;
    let fwin=document.getElementById('f_winners').checked;
    let fOnly=document.getElementById('f_only').checked;
    let o1=[num('o1min',0),num('o1max',999)], oX=[num('oXmin',0),num('oXmax',999)], o2=[num('o2min',0),num('o2max',999)];
    // filtre aktif mi? (sonuç seçili ya da bir oran aralığı girilmiş ya da beraberlik filtresi)
    let oddsActive = o1[0]>0||o1[1]<999||oX[0]>0||oX[1]<999||o2[0]>0||o2[1]<999;
    let filterActive = (fres!=='ALL') || oddsActive || (fdraw!=='ALL');
    let html='', exp=['EV_TAKIM | DEP_TAKIM | SONUC | EV_S5_PUAN | EV_S5_ATTIGI | EV_S5_YEDIGI | DEP_S5_PUAN | DEP_S5_ATTIGI | DEP_S5_YEDIGI'], hlCount=0, shown=0, disp=0;

    // Tüm maçları birleştir → round numarasına göre AZALAN sırala (yüksek round üstte, 1. Round en altta)
    let all=[];
    rounds.forEach(r=>{ if(fr!=='ALL' && r.no!==fr) return; r.matches.forEach(m=>all.push({m, rno:r.no})); });
    all.sort((a,b)=>(parseInt(b.rno)||-1)-(parseInt(a.rno)||-1) || dateKey(b.m.date)-dateKey(a.m.date));
    let blocks=[], cur=null;
    all.forEach(({m,rno})=>{
        shown++;
        // vurgulanacak oran: sonuç (skordan); yoksa favori (en düşük)
        let hi = m.res ? ({'1':0,'X':1,'2':2})[m.res] : m.o.indexOf(Math.min(...m.o));
        let od = m.o.map((v,i)=>`<td class="od${i===hi?' hl':''}">${v.toFixed(2)}</td>`).join('');
        // filtreye uyuyor mu?
        let resOk = (fres==='ALL') ? true : (fres==='PEND' ? !m.res : m.res===fres);
        let oddOk = m.o[0]>=o1[0]&&m.o[0]<=o1[1]&&m.o[1]>=oX[0]&&m.o[1]<=oX[1]&&m.o[2]>=o2[0]&&m.o[2]<=o2[1];
        let dw = drawWarn(m);
        let drawOk = (fdraw==='ALL') ? true : (dw.ok && dw.warn);
        let hlRow = filterActive && resOk && oddOk && drawOk;
        if(hlRow) hlCount++;
        if(hlRow || !filterActive){ let h5=last5(m.home), a5=last5(m.away);
            exp.push(`${m.home} | ${m.away} | ${m.res||'-'} | ${h5.pts} | ${h5.gf} | ${h5.ga} | ${a5.pts} | ${a5.gf} | ${a5.ga}`); }
        // "sadece seçilenleri göster" açıksa ve filtre aktifse, uymayan satırı gizle
        if(fOnly && filterActive && !hlRow) return;
        disp++;
        let hp=pts(m.home), ap=pts(m.away);
        let ptsHtml = `<div class="pts">${m.home}: <b>T${hp.t}</b> · 5:${hp.s5} · 10:${hp.s10} &nbsp;|&nbsp; ${m.away}: <b>T${ap.t}</b> · 5:${ap.s5} · 10:${ap.s10}</div>`;
        // Beraberlik uyarısı rozeti + (oynanmışsa) gerçekleşen sonuç işareti
        let rc = (dw.ok && m.res) ? `<span class="rc">${m.res==='X'?'✓ X':'✗ '+m.res}</span>` : '';
        let dsHtml = dw.warn
            ? `<span class="dsb hot">⚠️ Beraberlik Uyarısı${rc}</span><span class="dsdetail">${dw.detail}</span>`
            : (dw.ok
                ? `<span class="dsb">Uyarı yok${rc}</span><span class="dsdetail">${dw.detail}</span>`
                : `<span class="dsb">— ${dw.detail}</span>`);
        // satır rengi: kazananlar açık + uyarı verilmiş + oynanmış → berabereyse yeşil, değilse kırmızı; yoksa filtre vurgusu
        let cls = (fwin && dw.warn && m.res) ? (m.res==='X' ? 'row-win' : 'row-loss') : (hlRow ? 'row-hl' : '');
        let tr = `<tr${cls?` class="${cls}"`:''}><td class="match">${m.home} - ${m.away}${ptsHtml}${dsHtml}</td><td class="score">${m.score||'?'}</td>${od}<td class="date">${m.date}</td></tr>`;
        if(!cur || cur.rno!==rno){ cur={rno, rows:''}; blocks.push(cur); }
        cur.rows += tr;
    });
    blocks.forEach(b=>{ if(b.rows) html += `<div class="round"><div class="round-head"><span>${b.rno}. Round</span></div>
        <table><thead><tr><th>Maç</th><th>Skor</th><th>1</th><th>X</th><th>2</th><th>Tarih</th></tr></thead><tbody>${b.rows}</tbody></table></div>`; });
    let bt = drawBacktest();
    let btTxt = bt.pass
        ? `  •  📉 GEÇMİŞ TESTİ: uyarı çıkan ${bt.pass} maçın %${(100*bt.rate).toFixed(0)}'ı (${bt.passX}/${bt.pass}) gerçekten X bitmiş — taban X oranı %${(100*bt.base).toFixed(0)}`
        : `  •  📉 GEÇMİŞ TESTİ: uyarı çıkan oynanmış maç yok`;
    document.getElementById('stats').innerText = (filterActive
        ? `🟢 Vurgulanan: ${hlCount} maç` + (fOnly?`  •  gösterilen: ${disp}`:``) + `  •  (toplam ${shown} maç)`
        : `Toplam ${shown} maç listede`) + btTxt;
    document.getElementById('out').innerHTML = html || '<div style="color:var(--muted);padding:14px;">Filtreye uyan maç yok.</div>';
    exportText = exp.join('\n');
    renderFixture();
}

function kopyala(){
    if(!exportText){ alert('Önce DÜZENLE bas.'); return; }
    const done=()=>alert('✅ Kopyalandı!');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(exportText).then(done).catch(fb); else fb();
    function fb(){let ta=document.createElement('textarea');ta.value=exportText;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('Kopyalanamadı');}document.body.removeChild(ta);}
}
</script>
